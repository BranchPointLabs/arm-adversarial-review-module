style: slate

backend:
  default: heuristic
  model: null

output:
  attention_blocks: true
  merge_duplicate_findings: true
  default_path: docs/arm
  max_words:
    idea: 500
    prd: 800
    rfc: 900
    executive: 700
    roast: 1200
    decide: 300

verdicts:
  - Approved
  - Approved with Conditions
  - Needs Revision
  - Needs Validation
  - Do Not Proceed

commands:
  review_idea:
    personas: [critic, cpo, customer, pm]
  review_prd:
    personas: [critic, cpo, pm, customer, qa]
  review_rfc:
    personas: [critic, cto, architect, security, qa]
  review_executive:
    personas: [critic, cpo, cto]
  review_roast:
    personas: [critic, cpo, cto, pm, architect, security, qa, customer]
  decide:
    personas: [critic, cpo, cto]

checklists:
  idea: checklists/idea.md
  prd: checklists/prd.md
  rfc: checklists/rfc.md
  executive: checklists/executive.md

schemas:
  review: schemas/review-output.md
  decision: schemas/decision-output.md
  finding: schemas/finding.md
  persona: schemas/persona-output.md

prompts:
  system: prompts/system.md
  review: prompts/review.md
  decide: prompts/decide.md
